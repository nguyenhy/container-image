name: Build WordPress 7.0.4 PHP 8.3 FPM Alpine with PECL Redis

on:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - images/wordpress-7.0.4-php8.3-fpm-alpine-ext-pecl/**
      - .github/workflows/wordpress-7.0.4-php8.3-fpm-alpine-ext-pecl.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        env:
          IMAGE: ghcr.io/${{ github.repository }}/wordpress-7.0.4-php8.3-fpm-alpine-ext-pecl
          TAG: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          docker buildx build \
            --push \
            --cache-from type=gha,scope=wordpress-7.0.4-php8.3-fpm-alpine-ext-pecl \
            --cache-to type=gha,mode=max,scope=wordpress-7.0.4-php8.3-fpm-alpine-ext-pecl \
            --tag "${IMAGE}:${TAG}" \
            --file images/wordpress-7.0.4-php8.3-fpm-alpine-ext-pecl/Dockerfile \
            images/wordpress-7.0.4-php8.3-fpm-alpine-ext-pecl
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${TAG}"
